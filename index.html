<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Glasmorphism Calculator</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="page-bg"></div>
  <main class="calculator-shell">
    <div class="calculator-card">
      <div class="calculator-header">
        <div>
          <h1>Glass Calculator</h1>
          <p>Clean UI with glasmorphism</p>
        </div>
      </div>
      <div class="display-panel">
        <div id="previousOperand" class="display display--previous"></div>
        <div id="currentOperand" class="display display--current">0</div>
      </div>
      <div class="button-grid">
        <button class="btn btn--function" data-action="clear">AC</button>
        <button class="btn btn--function" data-action="delete">DEL</button>
        <button class="btn btn--operation" data-action="operation" data-value="%">%</button>
        <button class="btn btn--operation" data-action="operation" data-value="/">÷</button>

        <button class="btn" data-action="number" data-value="7">7</button>
        <button class="btn" data-action="number" data-value="8">8</button>
        <button class="btn" data-action="number" data-value="9">9</button>
        <button class="btn btn--operation" data-action="operation" data-value="*">×</button>

        <button class="btn" data-action="number" data-value="4">4</button>
        <button class="btn" data-action="number" data-value="5">5</button>
        <button class="btn" data-action="number" data-value="6">6</button>
        <button class="btn btn--operation" data-action="operation" data-value="-">−</button>

        <button class="btn" data-action="number" data-value="1">1</button>
        <button class="btn" data-action="number" data-value="2">2</button>
        <button class="btn" data-action="number" data-value="3">3</button>
        <button class="btn btn--operation" data-action="operation" data-value="+">+</button>

        <button class="btn" data-action="number" data-value="0">0</button>
        <button class="btn" data-action="number" data-value=".">.</button>
        <button class="btn btn--span" data-action="calculate">=</button>
      </div>
    </div>
  </main>
  <script src="script.js"></script>
</body>
</html>
